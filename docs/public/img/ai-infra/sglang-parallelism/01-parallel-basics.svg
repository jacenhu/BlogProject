<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1190" viewBox="0 0 900 1190">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#748A90"/></marker></defs>
<rect width="900" height="1190" fill="#F7FAF9"/>
<text x="48" y="52" font-family="'Hiragino Sans GB', 'PingFang SC', sans-serif" font-size="23" fill="#087E82" font-weight="700" text-anchor="start">SGLANG  /  并行策略  /  01</text>
<text x="48" y="113" font-family="'Hiragino Sans GB', 'PingFang SC', sans-serif" font-size="43" fill="#16333B" font-weight="700" text-anchor="start">TP、PP、DP：从哪里拆开？</text>
<text x="48" y="162" font-family="'Hiragino Sans GB', 'PingFang SC', sans-serif" font-size="28" fill="#61757B" font-weight="400" text-anchor="start">先看切分对象，再讨论性能收益。</text>
<line x1="48" y1="1128" x2="852" y2="1128" stroke="#D4DFDF" stroke-width="2"/>
<text x="48" y="1165" font-family="'Hiragino Sans GB', 'PingFang SC', sans-serif" font-size="23" fill="#61757B" font-weight="400" text-anchor="start">概念示意 · 组合需满足模型与后端约束</text>
<rect x="48" y="201" width="804" height="270" rx="16" fill="white" stroke="#D5E2E2" stroke-width="2"/>
<text x="76" y="248" font-family="'Hiragino Sans GB', 'PingFang SC', sans-serif" font-size="34" fill="#087E82" font-weight="700" text-anchor="start">TP · 拆开每层的张量</text>
<text x="76" y="292" font-family="'Hiragino Sans GB', 'PingFang SC', sans-serif" font-size="28" fill="#61757B" font-weight="400" text-anchor="start">同一请求，由多张 GPU 协同计算。</text>
<rect x="76" y="326" width="165" height="88" rx="10" fill="#E7F4F1" stroke="#BAD9D5" stroke-width="2"/>
<text x="158.5" y="365" font-family="'Hiragino Sans GB', 'PingFang SC', sans-serif" font-size="29" fill="#16333B" font-weight="600" text-anchor="middle">GPU 0</text>
<text x="158.5" y="397" font-family="'Hiragino Sans GB', 'PingFang SC', sans-serif" font-size="25" fill="#61757B" font-weight="400" text-anchor="middle">张量分片 0</text>
<rect x="263" y="326" width="165" height="88" rx="10" fill="#E7F4F1" stroke="#BAD9D5" stroke-width="2"/>
<text x="345.5" y="365" font-family="'Hiragino Sans GB', 'PingFang SC', sans-serif" font-size="29" fill="#16333B" font-weight="600" text-anchor="middle">GPU 1</text>
<text x="345.5" y="397" font-family="'Hiragino Sans GB', 'PingFang SC', sans-serif" font-size="25" fill="#61757B" font-weight="400" text-anchor="middle">张量分片 1</text>
<rect x="450" y="326" width="165" height="88" rx="10" fill="#E7F4F1" stroke="#BAD9D5" stroke-width="2"/>
<text x="532.5" y="365" font-family="'Hiragino Sans GB', 'PingFang SC', sans-serif" font-size="29" fill="#16333B" font-weight="600" text-anchor="middle">GPU 2</text>
<text x="532.5" y="397" font-family="'Hiragino Sans GB', 'PingFang SC', sans-serif" font-size="25" fill="#61757B" font-weight="400" text-anchor="middle">张量分片 2</text>
<rect x="637" y="326" width="165" height="88" rx="10" fill="#E7F4F1" stroke="#BAD9D5" stroke-width="2"/>
<text x="719.5" y="365" font-family="'Hiragino Sans GB', 'PingFang SC', sans-serif" font-size="29" fill="#16333B" font-weight="600" text-anchor="middle">GPU 3</text>
<text x="719.5" y="397" font-family="'Hiragino Sans GB', 'PingFang SC', sans-serif" font-size="25" fill="#61757B" font-weight="400" text-anchor="middle">张量分片 3</text>
<text x="76" y="451" font-family="'Hiragino Sans GB', 'PingFang SC', sans-serif" font-size="28" fill="#3669AE" font-weight="400" text-anchor="start">典型代价：层内集合通信</text>
<rect x="48" y="491" width="804" height="270" rx="16" fill="white" stroke="#D5E2E2" stroke-width="2"/>
<text x="76" y="538" font-family="'Hiragino Sans GB', 'PingFang SC', sans-serif" font-size="34" fill="#087E82" font-weight="700" text-anchor="start">PP · 按模型层分 stage</text>
<text x="76" y="582" font-family="'Hiragino Sans GB', 'PingFang SC', sans-serif" font-size="28" fill="#61757B" font-weight="400" text-anchor="start">一组 GPU 负责前段层，另一组负责后段层。</text>
<rect x="90" y="617" width="300" height="88" rx="10" fill="#E7F4F1" stroke="#BAD9D5" stroke-width="2"/>
<text x="240.0" y="656" font-family="'Hiragino Sans GB', 'PingFang SC', sans-serif" font-size="29" fill="#16333B" font-weight="600" text-anchor="middle">Stage 0</text>
<text x="240.0" y="688" font-family="'Hiragino Sans GB', 'PingFang SC', sans-serif" font-size="25" fill="#61757B" font-weight="400" text-anchor="middle">前段模型层</text>
<line x1="409" y1="661" x2="474" y2="661" stroke="#748A90" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="495" y="617" width="300" height="88" rx="10" fill="#E7F4F1" stroke="#BAD9D5" stroke-width="2"/>
<text x="645.0" y="656" font-family="'Hiragino Sans GB', 'PingFang SC', sans-serif" font-size="29" fill="#16333B" font-weight="600" text-anchor="middle">Stage 1</text>
<text x="645.0" y="688" font-family="'Hiragino Sans GB', 'PingFang SC', sans-serif" font-size="25" fill="#61757B" font-weight="400" text-anchor="middle">后段模型层</text>
<text x="76" y="741" font-family="'Hiragino Sans GB', 'PingFang SC', sans-serif" font-size="28" fill="#3669AE" font-weight="400" text-anchor="start">典型代价：激活传输与流水线气泡</text>
<rect x="48" y="781" width="804" height="310" rx="16" fill="white" stroke="#D5E2E2" stroke-width="2"/>
<text x="76" y="828" font-family="'Hiragino Sans GB', 'PingFang SC', sans-serif" font-size="34" fill="#087E82" font-weight="700" text-anchor="start">普通 DP · 分配不同请求</text>
<text x="76" y="872" font-family="'Hiragino Sans GB', 'PingFang SC', sans-serif" font-size="28" fill="#61757B" font-weight="400" text-anchor="start">每个副本都能执行完整的逻辑模型。</text>
<rect x="90" y="909" width="300" height="88" rx="10" fill="#E7F4F1" stroke="#BAD9D5" stroke-width="2"/>
<text x="240.0" y="948" font-family="'Hiragino Sans GB', 'PingFang SC', sans-serif" font-size="29" fill="#16333B" font-weight="600" text-anchor="middle">请求 A → 副本 0</text>
<text x="240.0" y="980" font-family="'Hiragino Sans GB', 'PingFang SC', sans-serif" font-size="25" fill="#61757B" font-weight="400" text-anchor="middle">可在副本内采用 TP</text>
<rect x="495" y="909" width="300" height="88" rx="10" fill="#E7F4F1" stroke="#BAD9D5" stroke-width="2"/>
<text x="645.0" y="948" font-family="'Hiragino Sans GB', 'PingFang SC', sans-serif" font-size="29" fill="#16333B" font-weight="600" text-anchor="middle">请求 B → 副本 1</text>
<text x="645.0" y="980" font-family="'Hiragino Sans GB', 'PingFang SC', sans-serif" font-size="25" fill="#61757B" font-weight="400" text-anchor="middle">可在副本内采用 TP</text>
<text x="76" y="1059" font-family="'Hiragino Sans GB', 'PingFang SC', sans-serif" font-size="28" fill="#3669AE" font-weight="400" text-anchor="start">典型代价：重复权重、分散的缓存与排队</text>
</svg>