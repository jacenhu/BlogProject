<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1180" viewBox="0 0 900 1180">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#748A90"/></marker></defs>
<rect width="900" height="1180" fill="#F7FAF9"/>
<text x="48" y="52" font-family="'Hiragino Sans GB', 'PingFang SC', sans-serif" font-size="23" fill="#087E82" font-weight="700" text-anchor="start">SGLANG  /  并行策略  /  04</text>
<text x="48" y="113" font-family="'Hiragino Sans GB', 'PingFang SC', sans-serif" font-size="43" fill="#16333B" font-weight="700" text-anchor="start">PP 与 PD：切分边界不同</text>
<text x="48" y="162" font-family="'Hiragino Sans GB', 'PingFang SC', sans-serif" font-size="28" fill="#61757B" font-weight="400" text-anchor="start">一个按层划分，一个按服务阶段划分。</text>
<line x1="48" y1="1118" x2="852" y2="1118" stroke="#D4DFDF" stroke-width="2"/>
<text x="48" y="1155" font-family="'Hiragino Sans GB', 'PingFang SC', sans-serif" font-size="23" fill="#61757B" font-weight="400" text-anchor="start">概念示意 · 组合需满足模型与后端约束</text>
<rect x="48" y="201" width="804" height="319" rx="16" fill="white" stroke="#D5E2E2" stroke-width="2"/>
<text x="76" y="248" font-family="'Hiragino Sans GB', 'PingFang SC', sans-serif" font-size="34" fill="#087E82" font-weight="700" text-anchor="start">PP · 一次模型执行，经过不同 stage</text>
<text x="76" y="292" font-family="'Hiragino Sans GB', 'PingFang SC', sans-serif" font-size="28" fill="#61757B" font-weight="400" text-anchor="start">每个 stage 只负责一部分模型层。</text>
<rect x="82" y="326" width="303" height="88" rx="10" fill="#E7F4F1" stroke="#BAD9D5" stroke-width="2"/>
<text x="233.5" y="365" font-family="'Hiragino Sans GB', 'PingFang SC', sans-serif" font-size="29" fill="#16333B" font-weight="600" text-anchor="middle">前段模型层</text>
<text x="233.5" y="397" font-family="'Hiragino Sans GB', 'PingFang SC', sans-serif" font-size="25" fill="#61757B" font-weight="400" text-anchor="middle">Stage 0</text>
<rect x="517" y="326" width="303" height="88" rx="10" fill="#E7F4F1" stroke="#BAD9D5" stroke-width="2"/>
<text x="668.5" y="365" font-family="'Hiragino Sans GB', 'PingFang SC', sans-serif" font-size="29" fill="#16333B" font-weight="600" text-anchor="middle">后段模型层</text>
<text x="668.5" y="397" font-family="'Hiragino Sans GB', 'PingFang SC', sans-serif" font-size="25" fill="#61757B" font-weight="400" text-anchor="middle">Stage 1</text>
<line x1="403" y1="369" x2="492" y2="369" stroke="#748A90" stroke-width="3" marker-end="url(#arrow)"/>
<text x="450" y="447" font-family="'Hiragino Sans GB', 'PingFang SC', sans-serif" font-size="29" fill="#3669AE" font-weight="500" text-anchor="middle">传递激活</text>
<text x="76" y="494" font-family="'Hiragino Sans GB', 'PingFang SC', sans-serif" font-size="29" fill="#61757B" font-weight="400" text-anchor="start">每次模型前向，都经过各个 stage。</text>
<rect x="48" y="546" width="804" height="507" rx="16" fill="white" stroke="#D5E2E2" stroke-width="2"/>
<text x="76" y="593" font-family="'Hiragino Sans GB', 'PingFang SC', sans-serif" font-size="34" fill="#087E82" font-weight="700" text-anchor="start">PD · Prefill 与 Decode 使用不同资源池</text>
<text x="76" y="637" font-family="'Hiragino Sans GB', 'PingFang SC', sans-serif" font-size="28" fill="#61757B" font-weight="400" text-anchor="start">每个池内部仍可使用 TP、PP、EP。</text>
<rect x="82" y="673" width="303" height="88" rx="10" fill="#E7F4F1" stroke="#BAD9D5" stroke-width="2"/>
<text x="233.5" y="712" font-family="'Hiragino Sans GB', 'PingFang SC', sans-serif" font-size="29" fill="#16333B" font-weight="600" text-anchor="middle">Prefill 池</text>
<text x="233.5" y="744" font-family="'Hiragino Sans GB', 'PingFang SC', sans-serif" font-size="25" fill="#61757B" font-weight="400" text-anchor="middle">处理输入 token</text>
<rect x="517" y="673" width="303" height="88" rx="10" fill="#E7F4F1" stroke="#BAD9D5" stroke-width="2"/>
<text x="668.5" y="712" font-family="'Hiragino Sans GB', 'PingFang SC', sans-serif" font-size="29" fill="#16333B" font-weight="600" text-anchor="middle">Decode 池</text>
<text x="668.5" y="744" font-family="'Hiragino Sans GB', 'PingFang SC', sans-serif" font-size="25" fill="#61757B" font-weight="400" text-anchor="middle">逐步生成 token</text>
<line x1="403" y1="717" x2="492" y2="717" stroke="#748A90" stroke-width="3" marker-end="url(#arrow)"/>
<text x="450" y="803" font-family="'Hiragino Sans GB', 'PingFang SC', sans-serif" font-size="30" fill="#3669AE" font-weight="600" text-anchor="middle">阶段交接：传递所需 KV</text>
<rect x="76" y="850" width="748" height="114" rx="16" fill="#F7F1E9" stroke="#E3D0BA" stroke-width="2"/>
<text x="104" y="897" font-family="'Hiragino Sans GB', 'PingFang SC', sans-serif" font-size="32" fill="#B36A32" font-weight="600" text-anchor="start">资源按池计算后相加。</text>
<text x="104" y="941" font-family="'Hiragino Sans GB', 'PingFang SC', sans-serif" font-size="28" fill="#16333B" font-weight="400" text-anchor="start">两边排队与 KV 传输都影响请求延迟。</text>
<text x="76" y="1019" font-family="'Hiragino Sans GB', 'PingFang SC', sans-serif" font-size="29" fill="#61757B" font-weight="400" text-anchor="start">独立扩缩容的收益，需要覆盖传输成本。</text>
</svg>